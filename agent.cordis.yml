# The `coding` agent preset: a Windows-adapted copy of the official `minimal`
# preset (极简模式). Structure, tooling philosophy, and limits are identical:
# a fixed-prompt, two-tool coding-agent composition.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes only
# persistent `pwsh` and `str_replace_editor`. Context compaction is absent.
#
# The only functional difference from `minimal`: the persistent shell is pwsh
# (PowerShell 7) instead of bash. The official bash backend cannot run on
# Windows (its subprocess-seam terminal inspection is Linux/macOS-only), so the
# same three-layer architecture is provided by two local packages:
#   - dsh-terminal-pwsh                   (PTY backend, node-pty/ConPTY)
#   - dsh-tool-pwsh-persistent             (model-facing persistent pwsh tool)
# Both are shipped from ~/.dsh/.agent-presets/coding/pwsh-package/ and must be
# installed into the harness node_modules (see pwsh-package/install.ps1).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# `terminal-pwsh` and `persistent-pwsh` replace the official `terminal-bash` /
# `persistent-bash` rows with the Windows pwsh equivalents.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-pwsh
      name: 'dsh-terminal-pwsh/lib/index.js'
      config:
        timeoutMs: 300000

    - id: persistent-pwsh
      name: 'dsh-tool-pwsh-persistent/lib/index.js'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a pwsh (PowerShell 7) shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to common Windows tooling: PowerShell cmdlets and native executables on PATH.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'Get-Content C:\path\to\file | Select-Object -Skip 9 -First 16'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Process' or a PowerShell background job.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
